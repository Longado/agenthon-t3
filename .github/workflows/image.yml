name: image
# Build the linux/amd64 submission image and push it to ghcr.io/longado/agenthon-t3 (tag = short sha).
# Run manually; the digest printed in the summary goes into submission.json.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/longado/agenthon-t3:${{ github.sha }}
      - run: |
          echo "image: ghcr.io/longado/agenthon-t3:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST=${{ steps.push.outputs.digest }}"
