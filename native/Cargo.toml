[package]
name = "t3sim"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "t3sim"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
parquet = { version = "60", default-features = false, features = ["snap"] }
bytes = "1"
snap = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
